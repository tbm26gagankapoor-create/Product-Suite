
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vulcan Products</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                750: '#2d3748',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom Ultra-Slim Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.3); 
        border-radius: 99px;
        transition: background 0.2s ease;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1); 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 163, 175, 0.6); 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Wizard Step Transition Animations */
      @keyframes slideInFromRight {
        from { transform: translateX(30px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideInFromLeft {
        from { transform: translateX(-30px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideOutToLeft {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(-30px); opacity: 0; }
      }
      @keyframes slideOutToRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(30px); opacity: 0; }
      }
      @keyframes progressPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .animate-slideInFromRight { animation: slideInFromRight 0.3s ease-out forwards; }
      .animate-slideInFromLeft { animation: slideInFromLeft 0.3s ease-out forwards; }
      .animate-slideOutToLeft { animation: slideOutToLeft 0.2s ease-in forwards; }
      .animate-slideOutToRight { animation: slideOutToRight 0.2s ease-in forwards; }
      .animate-progressPulse { animation: progressPulse 1.5s ease-in-out infinite; }

      /* Timeline Animations */
      @keyframes timelineBarEnter {
        from {
          opacity: 0;
          transform: translateY(-4px) scaleX(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scaleX(1);
        }
      }
      @keyframes todayPulse {
        0%, 100% {
          opacity: 0.6;
          box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 16px rgba(168, 85, 247, 0.6);
        }
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .animate-timelineBarEnter { animation: timelineBarEnter 0.25s ease-out forwards; }
      .animate-todayPulse { animation: todayPulse 2s ease-in-out infinite; }
      .animate-shimmer {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        background-size: 200% 100%;
        animation: shimmer 2s infinite;
      }

      /* Timeline task bar hover effects */
      .timeline-bar {
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }
      .timeline-bar:hover {
        transform: translateY(-1px) scale(1.02);
        filter: brightness(1.1);
      }

      /* Smooth group collapse animation */
      .timeline-group-content {
        transition: max-height 0.3s ease-out, opacity 0.2s ease-out;
        overflow: hidden;
      }
      .timeline-group-collapsed {
        max-height: 0;
        opacity: 0;
      }

      /* Skeleton Wave Animation */
      @keyframes skeleton-wave {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .skeleton-wave {
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.4) 50%, transparent 100%);
        background-size: 200% 100%;
        animation: skeleton-wave 1.5s ease-in-out infinite;
      }
      .dark .skeleton-wave {
        background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, 0.08) 50%, transparent 100%);
        background-size: 200% 100%;
        animation: skeleton-wave 1.5s ease-in-out infinite;
      }

      /* Loading Progress Animation */
      @keyframes loading-progress {
        0% { width: 0%; margin-left: 0%; }
        50% { width: 60%; margin-left: 20%; }
        100% { width: 0%; margin-left: 100%; }
      }
      .animate-loading-progress {
        animation: loading-progress 2s ease-in-out infinite;
      }

      /* Bounce Animation with Delay Support */
      @keyframes bounce-loading {
        0%, 80%, 100% { transform: translateY(0); }
        40% { transform: translateY(-6px); }
      }
      .animate-bounce-loading {
        animation: bounce-loading 1s ease-in-out infinite;
      }

      /* Fade in animation for loading screens */
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .animate-fadeIn {
        animation: fadeIn 0.3s ease-out forwards;
      }

      /* Brutalist Button Shadow System */
      .btn-shadow {
        box-shadow: 2px 2px 0px #030217;
        transition: box-shadow 0.15s ease, transform 0.15s ease;
      }
      .btn-shadow-sm {
        box-shadow: 1px 1px 0px #030217;
        transition: box-shadow 0.15s ease, transform 0.15s ease;
      }
      .btn-shadow:hover {
        box-shadow: 1px 1px 0px #030217;
        transform: translate(1px, 1px);
      }
      .btn-shadow-sm:hover {
        box-shadow: 0px 0px 0px #030217;
        transform: translate(1px, 1px);
      }
      .btn-shadow:active,
      .btn-shadow-sm:active {
        box-shadow: none;
        transform: translate(2px, 2px);
      }
      .btn-shadow:disabled,
      .btn-shadow-sm:disabled {
        box-shadow: 1px 1px 0px #030217;
        transform: none;
        opacity: 0.5;
        cursor: not-allowed;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7",

  }
}
</script>

</head>
