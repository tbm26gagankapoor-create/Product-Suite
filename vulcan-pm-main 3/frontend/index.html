
<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Vulcan Products</title>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                750: '#2d3748',
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
      }
      /* Custom Ultra-Slim Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(156, 163, 175, 0.3); 
        border-radius: 99px;
        transition: background 0.2s ease;
      }
      .dark ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1); 
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(156, 163, 175, 0.6); 
      }
      .dark ::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      /* Wizard Step Transition Animations */
      @keyframes slideInFromRight {
        from { transform: translateX(30px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideInFromLeft {
        from { transform: translateX(-30px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
      }
      @keyframes slideOutToLeft {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(-30px); opacity: 0; }
      }
      @keyframes slideOutToRight {
        from { transform: translateX(0); opacity: 1; }
        to { transform: translateX(30px); opacity: 0; }
      }
      @keyframes progressPulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      .animate-slideInFromRight { animation: slideInFromRight 0.3s ease-out forwards; }
      .animate-slideInFromLeft { animation: slideInFromLeft 0.3s ease-out forwards; }
      .animate-slideOutToLeft { animation: slideOutToLeft 0.2s ease-in forwards; }
      .animate-slideOutToRight { animation: slideOutToRight 0.2s ease-in forwards; }
      .animate-progressPulse { animation: progressPulse 1.5s ease-in-out infinite; }

      /* Timeline Animations */
      @keyframes timelineBarEnter {
        from {
          opacity: 0;
          transform: translateY(-4px) scaleX(0.95);
        }
        to {
          opacity: 1;
          transform: translateY(0) scaleX(1);
        }
      }
      @keyframes todayPulse {
        0%, 100% {
          opacity: 0.6;
          box-shadow: 0 0 8px rgba(168, 85, 247, 0.4);
        }
        50% {
          opacity: 1;
          box-shadow: 0 0 16px rgba(168, 85, 247, 0.6);
        }
      }
      @keyframes shimmer {
        0% { background-position: -200% 0; }
        100% { background-position: 200% 0; }
      }
      .animate-timelineBarEnter { animation: timelineBarEnter 0.25s ease-out forwards; }
      .animate-todayPulse { animation: todayPulse 2s ease-in-out infinite; }
      .animate-shimmer {
        background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
        background-size: 200% 100%;
        animation: shimmer 2s infinite;
      }

      /* Timeline task bar hover effects */
      .timeline-bar {
        transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
      }
      .timeline-bar:hover {
        transform: translateY(-1px) scale(1.02);
        filter: brightness(1.1);
      }

      /* Smooth group collapse animation */
      .timeline-group-content {
        transition: max-height 0.3s ease-out, opacity 0.2s ease-out;
        overflow: hidden;
      }
      .timeline-group-collapsed {
        max-height: 0;
        opacity: 0;
      }

      /* Copilot FAB Animations */
      @keyframes copilotPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(59,130,246,0.5); } 50% { box-shadow: 0 0 0 8px rgba(59,130,246,0); } }
      @keyframes copilotPanelIn { from { opacity:0; transform:scale(0.95) translateY(10px); } to { opacity:1; transform:scale(1) translateY(0); } }
      @keyframes copilotPanelOut { from { opacity:1; transform:scale(1) translateY(0); } to { opacity:0; transform:scale(0.95) translateY(10px); } }
      .animate-copilotPulse { animation: copilotPulse 2s ease-in-out infinite; }
      .animate-copilotPanelIn { animation: copilotPanelIn 0.25s ease-out forwards; }
      .animate-copilotPanelOut { animation: copilotPanelOut 0.2s ease-in forwards; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.37.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2.39.7",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "vite": "https://esm.sh/vite@^7.3.1",
    "react-dom": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-[#F8F9FC] dark:bg-[#050505] text-[#172B4D] dark:text-gray-100 overflow-hidden transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
