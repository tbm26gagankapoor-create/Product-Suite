services:
  # Frontend (React/Vite with nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Admin Portal (SaaS Management)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    ports:
      - "${ADMIN_PORT:-8084}:80"
    depends_on:
      api:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # Backend API
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      # PostgreSQL
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # MongoDB
      - MONGODB_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/${MONGO_DB}?authSource=admin
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      # Entra ID (Tenant SSO)
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID:-}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET:-}
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-common}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI}
      # Entra ID (Admin SSO)
      - ENTRA_ADMIN_CLIENT_ID=${ENTRA_ADMIN_CLIENT_ID:-}
      - ENTRA_ADMIN_CLIENT_SECRET=${ENTRA_ADMIN_CLIENT_SECRET:-}
      - ENTRA_ADMIN_TENANT_ID=${ENTRA_ADMIN_TENANT_ID:-common}
      - ENTRA_ADMIN_REDIRECT_URI=${ENTRA_ADMIN_REDIRECT_URI}
      - ENTRA_ADMIN_GROUP_ID=${ENTRA_ADMIN_GROUP_ID:-}
      - ENTRA_ADMIN_ALLOWED_DOMAINS=${ENTRA_ADMIN_ALLOWED_DOMAINS:-}
      # App URLs
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - ADMIN_URL=${ADMIN_URL:-http://localhost:8084}
      # OpenFGA
      - OPENFGA_API_URL=http://openfga:8080
      - OPENFGA_STORE_ID=${OPENFGA_STORE_ID:-}
      - OPENFGA_MODEL_ID=${OPENFGA_MODEL_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      openfga:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped
    volumes:
      - api-data:/app/data

  # PostgreSQL Database (Users, Tenants, Plans, SSO, Auth)
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # MongoDB Database (Projects, Tasks, Sprints, Comments, etc.)
  mongo:
    image: mongo:7
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network
    restart: unless-stopped

  # Adminer - Database management UI (PostgreSQL)
  adminer:
    image: adminer
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - app-network
    restart: unless-stopped

  # Mongo Express - MongoDB management UI
  mongo-express:
    image: mongo-express
    ports:
      - "${MONGO_EXPRESS_PORT:-8083}:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=${MONGO_USER}
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/
      - ME_CONFIG_BASICAUTH=false
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # OpenFGA Migrations (run before main service)
  openfga-migrate:
    image: openfga/openfga:latest
    command: migrate
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # OpenFGA - Fine-Grained Authorization
  openfga:
    image: openfga/openfga:latest
    command: run
    ports:
      - "${OPENFGA_HTTP_PORT:-8088}:8080"
      - "${OPENFGA_GRPC_PORT:-8089}:8081"
      - "${OPENFGA_PLAYGROUND_PORT:-3002}:3000"
    environment:
      - OPENFGA_DATASTORE_ENGINE=postgres
      - OPENFGA_DATASTORE_URI=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      - OPENFGA_PLAYGROUND_ENABLED=true
    depends_on:
      postgres:
        condition: service_healthy
      openfga-migrate:
        condition: service_completed_successfully
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  app-network:
    driver: bridge

volumes:
  api-data:
  postgres-data:
  mongo-data:
